[project]
name = "budlance"
version = "0.1.0"
description = "Reverse-budget AI travel agent on Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "supabase>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budlance"]
